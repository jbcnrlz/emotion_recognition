[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-recognition"
version = "0.1.0"
description = "Affective Computing and Emotion Recognition Framework (VAD, Distributions, Pain & Hedonics)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Joao Cardia" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "openpyxl>=3.0.0",
    "opencv-python>=4.5.0",
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "timm>=0.9.0",
    "tqdm>=4.64.0",
    "streamlit>=1.20.0",
    "shapely>=1.8.0",
    "tensorboard>=2.12.0",
    "requests>=2.28.0",
    "pyperclip>=1.8.0",
    "fpdf2>=2.7.0",
    "thop>=0.1.1",
    "torchviz>=0.0.2",
    "yellowbrick>=1.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]
vision = [
    "facenet-pytorch>=2.5.2",
    "face-alignment>=1.3.5"
]
llm = [
    "transformers>=4.30.0",
    "diffusers>=0.20.0",
    "peft>=0.4.0",
    "huggingface-hub>=0.16.0",
    "bert-score>=0.3.13",
    "pycocoevalcap>=1.2"
]
dashboard = [
    "plotly>=5.15.0",
    "wordcloud>=1.9.0"
]
all = [
    "facenet-pytorch>=2.5.2",
    "face-alignment>=1.3.5",
    "transformers>=4.30.0",
    "diffusers>=0.20.0",
    "peft>=0.4.0",
    "huggingface-hub>=0.16.0",
    "bert-score>=0.3.13",
    "pycocoevalcap>=1.2",
    "plotly>=5.15.0",
    "wordcloud>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "DatasetClasses*", "networks*", "loss*", "helper*", "metrics*"]
