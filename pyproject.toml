[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-recognition"
version = "0.1.0"
description = "Affective Computing and Emotion Recognition Framework (VAD, Distributions, Pain & Hedonics)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Joao Cardia" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "timm>=0.9.0",
    "tqdm>=4.64.0",
    "streamlit>=1.20.0",
    "shapely>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]
advanced = [
    "transformers",
    "diffusers",
    "peft",
    "plotly",
    "wordcloud"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "DatasetClasses*", "networks*", "loss*", "helper*", "metrics*"]

